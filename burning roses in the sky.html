<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol: SUNS - BURNING ROSES</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(to bottom, var(--void-black), var(--nuclear-orange));
        }
        
        #game-stage {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bridge-container {
            position: absolute;
            bottom: 30%;
            width: 80%;
            height: 40px;
            display: flex;
            justify-content: space-between;
        }

        .bridge-segment {
            width: 5%;
            height: 100%;
            background-color: var(--ash-grey);
            border-top: 4px solid var(--static-white);
            position: relative;
            transition: transform 0.5s, opacity 0.5s;
        }

        .bridge-segment.collapsed {
            transform: translateY(200px) rotate(20deg);
            opacity: 0;
        }

        .character {
            position: absolute;
            width: 48px;
            height: 48px;
            bottom: 30%; /* Matches bridge bottom */
            background-size: contain;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            transition: bottom 0.2s ease-out, left 0.1s linear;
        }

        #hero {
            left: 10%;
            background-image: url('harshpromlp-idle-v1.png');
            /* Fallback */
            background-color: var(--glitch-cyan); 
        }

        #partner {
            right: 10%;
            background-image: url('nanlp-idle-v1.png');
            /* Fallback */
            background-color: var(--nuclear-orange);
        }

        .glitch-rose {
            position: absolute;
            left: 50%;
            bottom: 35%;
            font-size: 3rem;
            display: none;
            cursor: pointer;
            animation: glitch-anim 0.5s infinite;
        }

        .choice-container {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
        }

        .choice-btn {
            background: var(--void-black);
            color: var(--static-white);
            border: 2px solid var(--nuclear-orange);
            padding: 15px;
            font-family: var(--font-nes);
            cursor: pointer;
            text-align: left;
        }

        .choice-btn:hover {
            background: var(--nuclear-orange);
            color: var(--void-black);
        }

        /* Screen Shake */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>
    <canvas id="particle-canvas"></canvas>

    <div id="game-stage">
        <div class="bridge-container" id="bridge">
            <!-- Segments generated by JS -->
        </div>
        <div id="hero" class="character"></div>
        <div id="partner" class="character"></div>
        <div id="rose" class="glitch-rose">🌹</div>
    </div>

    <div class="choice-container" id="choices">
        <button class="choice-btn" onclick="makeChoice('A')">A) "You can build them back up."</button>
        <button class="choice-btn" onclick="makeChoice('B')">B) "So don't apologize. I'm losing what I don't deserve."</button>
    </div>

    <!-- Dialogue UI -->
    <div class="dialogue-container">
        <div class="portrait-frame">
            <img src="" alt="Character Portrait">
        </div>
        <div class="dialogue-text-area">
            <span class="name-tag"></span>
            <span class="dialogue-text"></span>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="burning_roses.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
    <script>
        // Override Particle Colors for Ash
        class AshParticle extends Particle {
            constructor() {
                super();
                this.color = Math.random() > 0.5 ? '#2A2A2A' : '#FF4500'; // Grey or Orange
                this.speedY = Math.random() * 2 + 1; // Faster falling
            }
        }
        // Re-init particles with Ash
        particles.length = 0;
        for (let i = 0; i < 50; i++) {
            particles.push(new AshParticle());
        }

        // Bridge Logic
        const bridgeContainer = document.getElementById('bridge');
        const hero = document.getElementById('hero');
        const partner = document.getElementById('partner');
        const rose = document.getElementById('rose');
        
        const segmentCount = 10;
        const segments = [];
        
        // Generate Bridge
        for(let i=0; i<segmentCount; i++) {
            const seg = document.createElement('div');
            seg.classList.add('bridge-segment');
            seg.dataset.index = i;
            bridgeContainer.appendChild(seg);
            segments.push(seg);
        }

        // Movement Logic
        let heroIndex = 0; // Starts at left (outside bridge effectively, but let's say index 0 is first segment)
        let isJumping = false;
        let gameActive = true;

        // Initial positions (Visual approximation)
        // We will move hero based on segment index
        function updateHeroPosition() {
            const segmentWidth = 100 / segmentCount; // percent
            // Adjust position to center on segment
            const leftPos = (heroIndex * segmentWidth) + (segmentWidth / 2) - 2; // -2 for half character width approx %
            // hero.style.left = `calc(10% + ${leftPos}%)`; // Offset by container start
            
            // Simpler: Map index to screen %
            // Bridge is 80% width, starts at 10% left.
            const containerLeft = 10;
            const step = 80 / segmentCount;
            const finalLeft = containerLeft + (heroIndex * step);
            hero.style.left = `${finalLeft}%`;

            // Check collapse
            checkCollapse(heroIndex);
            
            // Check win
            if(heroIndex >= segmentCount - 1) {
                gameActive = false;
                triggerMeeting();
            }
        }

        function checkCollapse(index) {
            // Collapse previous segments
            if(index > 0) {
                const prev = segments[index - 1];
                if(!prev.classList.contains('collapsed')) {
                    setTimeout(() => {
                        prev.classList.add('collapsed');
                    }, 500); // Delay collapse slightly
                }
            }
            
            // If current segment is collapsed (if we jumped back or something?), fall
            if(segments[index] && segments[index].classList.contains('collapsed') && !isJumping) {
                fall();
            }
        }

        function jump() {
            if(isJumping || !gameActive) return;
            isJumping = true;
            hero.style.bottom = '45%'; // Jump up
            
            // Move forward 2 segments
            setTimeout(() => {
                if(heroIndex < segmentCount - 1) {
                    heroIndex += 2;
                    if(heroIndex >= segmentCount) heroIndex = segmentCount - 1;
                    updateHeroPosition();
                }
                hero.style.bottom = '30%'; // Land
                isJumping = false;
            }, 300);
        }

        function moveRight() {
            if(isJumping || !gameActive) return;
            heroIndex++;
            updateHeroPosition();
        }

        function fall() {
            gameActive = false;
            hero.style.transform = 'translateY(200px) rotate(45deg)';
            hero.style.opacity = '0';
            showDialogue('hero', 'I fell into the void...', () => {
                location.reload();
            });
        }

        document.addEventListener('keydown', (e) => {
            if(!gameActive) return;
            if(e.code === 'ArrowRight') {
                moveRight();
            }
            if(e.code === 'Space') {
                jump();
            }
        });

        // Initialize position
        hero.style.left = '5%'; // Start before bridge

        // Start interactions
        setTimeout(() => {
            showDialogue('hero', 'A bridge of ash... I have to cross.');
            // Move hero onto first segment
            heroIndex = 0;
            updateHeroPosition();
        }, 1000);

        function triggerMeeting() {
            // Hero meets Partner
            rose.style.display = 'block';
            rose.addEventListener('click', () => {
                rose.style.display = 'none';
                startDialogueEvent();
            });
        }

        function startDialogueEvent() {
            showDialogue('partner', "I'm swimming in the smoke... of bridges I have burned.", () => {
                document.getElementById('choices').style.display = 'flex';
            });
        }

        window.makeChoice = function(option) {
            document.getElementById('choices').style.display = 'none';
            if(option === 'A') {
                // Fail
                document.body.classList.add('shake');
                const audio = new Audio('glitch_sound_placeholder.mp3'); // Placeholder
                // audio.play();
                showDialogue('partner', "No... that's not it.", () => {
                    location.reload();
                });
            } else {
                // Success
                rose.style.display = 'block';
                rose.textContent = '🌹'; // Blooming
                rose.style.color = '#FF0000';
                rose.style.textShadow = '0 0 10px #FF0000';
                
                showDialogue('partner', "So don't apologize. I'm losing what I don't deserve.", () => {
                    localStorage.setItem('fragment_2', 'found');
                    setTimeout(() => {
                        const nextBtn = document.createElement('a');
                        nextBtn.href = 'waiting for the proposal to end.html';
                        nextBtn.className = 'btn';
                        nextBtn.style.position = 'fixed';
                        nextBtn.style.top = '50%';
                        nextBtn.style.left = '50%';
                        nextBtn.style.transform = 'translate(-50%, -50%)';
                        nextBtn.textContent = 'ASCEND';
                        document.body.appendChild(nextBtn);
                    }, 1000);
                });
            }
        }
    </script>
</body>
</html>
